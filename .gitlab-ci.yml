stages:
  - lint-and-validate
  - test
  - build-validation

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/
    - back/node_modules/
    - back/auth-service/node_modules/

lint-auth-service:
  stage: lint-and-validate
  image: node:20-alpine
  before_script:
    - cd back/auth-service
    - npm ci --cache ../../.npm --prefer-offline
  script:
    - npm run lint
  only:
    - main
    - dev
    - merge_requests

validate-asyncapi:
  stage: lint-and-validate
  image: node:20-alpine
  script:
    - echo "Validating AsyncAPI schema..."
    - npx -y @asyncapi/cli validate asyncapi.yaml
  only:
    - main
    - dev
    - merge_requests

backend-tests:
  stage: test
  image: node:20-alpine
  before_script:
    - cd back
    - npm ci --cache ../.npm --prefer-offline
  script:
    - echo "Running backend unit and integration tests..."
    - npm test
  only:
    - main
    - dev
    - merge_requests

docker-build-check:
  stage: build-validation
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Verifying all Docker builds compile and package successfully..."
    - docker build -t pixpro-front:latest -f ./front/Dockerfile ./front
    - docker build -t pixpro-api-gateway:latest -f ./back/api-gateway/Dockerfile ./back
    - docker build -t pixpro-auth-service:latest -f ./back/auth-service/Dockerfile ./back
    - docker build -t pixpro-image-processing-service:latest -f ./back/image-processing-service/Dockerfile ./back
    - docker build -t pixpro-project-service:latest -f ./back/project-service/Dockerfile ./back
    - docker build -t pixpro-notification-service:latest -f ./back/notification-service/Dockerfile ./back
  only:
    - main
    - dev
    - merge_requests