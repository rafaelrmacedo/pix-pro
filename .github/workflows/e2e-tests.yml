name: E2E API Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Run Playwright API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start Microservices Stack (Docker Compose)
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for API Gateway & Services
        run: |
          echo "Waiting for API Gateway to be ready on http://localhost:4000/health..."
          timeout 60s bash -c 'until curl -s http://localhost:4000/health | grep -q "ok\|UP\|status"; do sleep 2; done' || exit 1
          echo "API Gateway is ready!"

      - name: Install Playwright & Dependencies (If test suite present)
        run: |
          if [ -f "tests/e2e/package.json" ]; then
            cd tests/e2e
            npm ci
            npx playwright install --with-deps chromium
          elif [ -f "package.json" ]; then
            npm ci
          fi

      - name: Execute Playwright API Tests
        run: |
          if [ -d "tests/e2e" ] && [ -f "tests/e2e/package.json" ]; then
            cd tests/e2e
            npx playwright test
          else
            echo "No Playwright tests found in tests/e2e yet. Skipping execution step."
          fi

      - name: Upload Test Report Artifacts
        if: always() && hashFiles('tests/e2e/playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Stop Microservices Stack
        if: always()
        run: |
          docker compose down -v
