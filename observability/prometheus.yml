global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: pixpro-api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:4000

  - job_name: pixpro-project-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - project-service:4003
